<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study · Fly Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%230f766e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/fonts/fonts.css?v=1">
<link rel="stylesheet" href="feather.css">
<link rel="stylesheet" href="study.css">
<link rel="stylesheet" href="ask/style.css?v=2">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></symbol>
<symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5V4.5a1.5 1.5 0 0 1 3 0V11v-5a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6.5 7S6 18 5 15l-1.2-3.2c-.4-1 .8-2 1.7-1.4L8 12z"/></symbol>
<symbol id="i-zin" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5M11 8.5v5M8.5 11h5"/></symbol>
<symbol id="i-zout" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></symbol>
<symbol id="i-ccw" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.3 5.7M4 12V7m0 5h5"/></symbol>
<symbol id="i-cw" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 0-2.3-5.7M20 12V7m0 5h-5"/></symbol>
<symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21l-4-4zM8 16l1.5 1.5M11 13l1.5 1.5M14 10l1.5 1.5"/></symbol>
<symbol id="i-fish" viewBox="0 0 24 24"><path d="M3 12c3-4 7-6 11-6 3 0 5 2 7 6-2 4-4 6-7 6-4 0-8-2-11-6z"/><circle cx="16.5" cy="11" r=".8"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/></symbol>
<symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 14a8 8 0 1 1 16 0"/><path d="M12 14l4-4"/><path d="M4 18h16"/></symbol>
<symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3c3 4.5 6 8.2 6 11.5a6 6 0 1 1-12 0C6 11.2 9 7.5 12 3z"/></symbol>
<symbol id="i-reed" viewBox="0 0 24 24"><path d="M12 21V8M12 8c0-3 2-5 5-5 0 3-2 5-5 5zM12 13c0-3-2-5-5-5 0 3 2 5 5 5z"/></symbol>
<symbol id="i-fly" viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="3" ry="5"/><path d="M9 11C5 8 3 5 3 5s4-1 7 3M15 11c4-3 6-6 6-6s-4-1-7 3"/></symbol>
<symbol id="i-brain" viewBox="0 0 24 24"><circle cx="9" cy="10" r="5"/><circle cx="15" cy="10" r="5"/><path d="M9 15c0 3 1.5 5 3 5s3-2 3-5"/></symbol>
</defs></svg>
<header id="shellBar"></header>
<div class="study-grid">
<div id="main">
  <nav id="benchTabs" aria-label="Benches"></nav>
  <div id="pagewrap"><div id="page"></div></div>
  <div id="status" class="hud"><span class="dot"></span><span id="statusText">connecting…</span></div>
  <div id="err" class="hud"></div>
</div>
<div id="rail">
  <div id="brainWrap">
    <canvas id="gl"></canvas>
    <div id="brainTag">OBSERVATION · LIVE BRAINS</div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab0" aria-selected="true"><svg class="ic"><use href="#i-fly"/></svg><span class="tn">Maxime</span><span class="tl">BANC · female</span></button>
      <button class="tab" role="tab" id="tab1" aria-selected="false"><svg class="ic"><use href="#i-fly"/></svg><span class="tn">Hagrid</span><span class="tl">Male CNS · male</span></button>
    </div>
    <div id="stage" tabindex="0" aria-label="3D brain. Drag to rotate, scroll to zoom, double-click to reset.">
      <div class="gshadow"></div>
      <div class="loader" id="stageLoader" hidden><span class="ring"></span><span>Preparing the specimen…</span></div>
      <div class="hint" id="stageHint"><svg class="ic"><use href="#i-hand"/></svg><span>Drag to turn · scroll to zoom</span></div>
      <div class="parttip" id="partTip" aria-hidden="true" hidden></div>
      <div class="rail">
        <button id="zin" aria-label="Zoom in" aria-pressed="false"><svg class="ic"><use href="#i-zin"/></svg></button>
        <button id="zout" aria-label="Zoom out" aria-pressed="false"><svg class="ic"><use href="#i-zout"/></svg></button>
      </div>
      <div class="turnpill">
        <button id="turnL" aria-label="Turn left"><svg class="ic"><use href="#i-ccw"/></svg></button>
        <button id="turn360" aria-label="Full turn">360°</button>
        <button id="turnR" aria-label="Turn right"><svg class="ic"><use href="#i-cw"/></svg></button>
      </div>
      <p class="caption" id="caption">Ask a question, and the brains respond here.</p>
    </div>
  </div>
  <div id="mini"></div>
</div>
</div>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>
<script src="duo/auth.js"></script>
<script src="feather.js"></script>
<script src="ask/app.js?v=31"></script>
<script type="module" src="study.js?v=2"></script>
</body>
</html>
